name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify tag matches package version
        run: |
          python -m pip install "tomli>=2; python_version < '3.11'"
          python scripts/verify-release-tag.py "${{ github.ref_name }}"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Run unit and disabled-by-default integration checks
        run: python -m unittest discover -s tests -v

  release:
    name: Build and publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          python -m pip install "tomli>=2; python_version < '3.11'"
          python scripts/verify-release-tag.py "${{ github.ref_name }}"
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade build && python -m build
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
