[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asclient"
version = "0.6.1"
description = "Dependency-free AScript local iOS device client"
requires-python = ">=3.10"

[project.scripts]
asc = "asclient.cli:main"

[tool.setuptools]
packages = ["asclient"]
