[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asclient"
version = "0.7.3"
description = "AScript local iOS device client"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.0"]

[project.scripts]
asc = "asclient.cli:main"

[tool.setuptools]
packages = ["asclient"]
